<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <base href="/active-theory/">
  <title>Lumora Interactive Experience</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    html, body, #Stage {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020707;
      touch-action: none;
    }

    #Stage, #Stage * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .GLA11y {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
      clip-path: inset(50%) !important;
      white-space: nowrap !important;
    }

    @font-face {
      font-family: nbarchitekt;
      src: url("assets/fonts/NBArchitektStd-Regular-export/NBArchitektStd-Regular.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
    }

    @font-face {
      font-family: nbarchitekt;
      src: url("assets/fonts/NBArchitektStd-Light-export/NBArchitektStd-Light.woff2") format("woff2");
      font-style: normal;
      font-weight: 300;
    }

    @font-face {
      font-family: nbarchitekt;
      src: url("assets/fonts/NBArchitektStd-Bold-export/NBArchitektStd-Bold.woff2") format("woff2");
      font-style: normal;
      font-weight: 700;
    }

    .nav-cn-overlay,
    .nav-cn-contact { display: none !important; pointer-events: none !important; }

    .ChatDOM {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .cage-core {
      --cage-core-y: 55%;
      position: fixed;
      z-index: 20;
      left: 50%;
      top: var(--cage-core-y);
      width: clamp(118px, 10vw, 168px);
      aspect-ratio: 1;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
      filter: saturate(.82);
      transform: translate(-50%, -50%) scale(.72);
      transition: opacity .65s ease, transform .9s cubic-bezier(.2, .72, .2, 1);
      will-change: top, opacity, transform;
    }

    .cage-core.is-visible {
      opacity: .82;
      transform: translate(-50%, -50%) scale(1);
    }

    .cage-core__beam {
      position: absolute;
      left: 50%;
      top: -82%;
      width: 22%;
      height: 264%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(173, 244, 255, .02) 26%, rgba(221, 249, 255, .18) 49%, rgba(175, 217, 255, .03) 72%, transparent);
      filter: blur(4px);
      opacity: .72;
    }

    .cage-core__ring {
      position: absolute;
      left: 50%;
      top: 50%;
      border: 1px solid rgba(211, 245, 255, .52);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(130, 223, 255, .18), inset 0 0 7px rgba(194, 164, 255, .12);
    }

    .cage-core__ring--outer {
      width: 100%;
      height: 38%;
      animation: cage-orbit-outer 9s linear infinite;
    }

    .cage-core__ring--inner {
      width: 72%;
      height: 72%;
      border-color: rgba(208, 187, 255, .38);
      animation: cage-orbit-inner 7s linear infinite reverse;
    }

    .cage-core__ring::before,
    .cage-core__ring::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #e7fbff;
      box-shadow: 0 0 9px 3px rgba(127, 225, 255, .65);
    }

    .cage-core__ring::before { left: 11%; top: 12%; }
    .cage-core__ring::after { right: 9%; bottom: 14%; width: 3px; height: 3px; }

    .cage-core__nucleus {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 35%;
      height: 55%;
      clip-path: polygon(50% 0, 86% 26%, 72% 82%, 50% 100%, 28% 82%, 14% 26%);
      background:
        linear-gradient(115deg, rgba(255, 255, 255, .92) 4%, rgba(159, 239, 255, .48) 31%, rgba(109, 111, 190, .2) 58%, rgba(223, 196, 255, .78) 83%),
        rgba(163, 226, 255, .3);
      border: 1px solid rgba(255, 255, 255, .74);
      filter: drop-shadow(0 0 8px rgba(129, 232, 255, .74)) drop-shadow(0 0 20px rgba(151, 131, 255, .34));
      transform: translate(-50%, -50%);
      animation: cage-core-breathe 3.8s ease-in-out infinite;
    }

    .cage-core__nucleus::after {
      content: "";
      position: absolute;
      inset: 18% 26%;
      background: linear-gradient(180deg, rgba(255, 255, 255, .94), rgba(159, 240, 255, .08));
      filter: blur(1px);
    }

    .cage-core__spark {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(225, 249, 255, .9);
      box-shadow: 0 0 7px 2px rgba(148, 226, 255, .45);
      animation: cage-spark 4.2s ease-in-out infinite;
    }

    .cage-core__spark--1 { left: 23%; top: 28%; animation-delay: -1.2s; }
    .cage-core__spark--2 { right: 18%; top: 37%; animation-delay: -2.7s; }
    .cage-core__spark--3 { left: 30%; bottom: 20%; animation-delay: -.4s; }

    @keyframes cage-orbit-outer {
      from { transform: translate(-50%, -50%) rotate(-8deg); }
      to { transform: translate(-50%, -50%) rotate(352deg); }
    }

    @keyframes cage-orbit-inner {
      from { transform: translate(-50%, -50%) rotateY(62deg) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotateY(62deg) rotate(360deg); }
    }

    @keyframes cage-core-breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(.94) rotate(-2deg); opacity: .78; }
      50% { transform: translate(-50%, -50%) scale(1.06) rotate(2deg); opacity: 1; }
    }

    @keyframes cage-spark {
      0%, 100% { opacity: .18; transform: translateY(8px) scale(.65); }
      50% { opacity: .9; transform: translateY(-8px) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cage-core__ring,
      .cage-core__nucleus,
      .cage-core__spark { animation: none; }
    }

  </style>
  <script>
    // The mirrored renderer expects to boot at the site root. Replacing this
    // iframe's history entry keeps routing local to the frame and never
    // navigates the parent Lumora application.
    history.replaceState(null, "", "/");
    window._ENV_ = "production";
    window._CMS_ = "";
    window._UNSUPPORTED_PAGE_ = "/active-theory/unsupported.html";
    // This identifies the mirrored engine's physical chunk filenames. Keep it
    // aligned with the bundled *.local-z-v2.js assets; URL query versions are
    // used separately for browser cache busting.
    window._CACHE_ = "local-z-v2";
    window.UIL_STATIC_PATH = "/active-theory/assets/data/uil.local-z-v2.json?v=lumora-en-v3";

    // The mirrored renderer includes a legacy Dreamwave live-control socket.
    // The local Lumora scene does not use that service, so keep its client
    // satisfied without leaking a connection outside this application.
    (() => {
      const NativeWebSocket = window.WebSocket;
      class LocalOnlySocket extends EventTarget {
        static CONNECTING = 0;
        static OPEN = 1;
        static CLOSING = 2;
        static CLOSED = 3;
        constructor(url) {
          super();
          this.url = String(url);
          this.readyState = LocalOnlySocket.CONNECTING;
          this.bufferedAmount = 0;
          this.extensions = "";
          this.protocol = "";
          this.binaryType = "blob";
          queueMicrotask(() => {
            this.readyState = LocalOnlySocket.OPEN;
            const event = new Event("open");
            this.dispatchEvent(event);
            this.onopen?.(event);
          });
        }
        send() {}
        close() {
          if (this.readyState === LocalOnlySocket.CLOSED) return;
          this.readyState = LocalOnlySocket.CLOSED;
          const event = new CloseEvent("close", { code: 1000, reason: "local scene" });
          this.dispatchEvent(event);
          this.onclose?.(event);
        }
      }
      function LumoraWebSocket(url, protocols) {
        if (/dreamwave\.network/i.test(String(url))) return new LocalOnlySocket(url);
        return protocols === undefined ? new NativeWebSocket(url) : new NativeWebSocket(url, protocols);
      }
      LumoraWebSocket.prototype = NativeWebSocket.prototype;
      Object.assign(LumoraWebSocket, { CONNECTING: 0, OPEN: 1, CLOSING: 2, CLOSED: 3 });
      window.WebSocket = LumoraWebSocket;
    })();

    const openLumoraAgent = () => parent.postMessage({ type: "lumora:open-agent" }, location.origin);
    const isAgentEntry = (target) => {
      const link = target?.closest?.("a");
      return Boolean(link && new URL(link.href, location.href).hash === "#lumora-agent-use");
    };
    const isShowcaseSurface = (target) => Boolean(target?.closest?.("#Stage, .FXScroll, canvas"));
    let showcasePress = null;
    document.addEventListener("pointerdown", (event) => {
      const target = event.target instanceof Element ? event.target : null;
      if (!isShowcaseSurface(target) || isAgentEntry(target)) return;
      showcasePress = { id: event.pointerId, x: event.clientX, y: event.clientY };
    }, true);
    document.addEventListener("pointerup", (event) => {
      const target = event.target instanceof Element ? event.target : null;
      if (!showcasePress || showcasePress.id !== event.pointerId || isAgentEntry(target)) {
        showcasePress = null;
        return;
      }
      const distance = Math.hypot(event.clientX - showcasePress.x, event.clientY - showcasePress.y);
      showcasePress = null;
      if (distance > 8 || !isShowcaseSurface(target)) return;
      event.preventDefault();
      event.stopImmediatePropagation();
    }, true);
    document.addEventListener("click", (event) => {
      const target = event.target instanceof Element ? event.target : null;
      const link = target?.closest("a");
      if (link && new URL(link.href, location.href).hash === "#lumora-agent-use") {
        event.preventDefault();
        event.stopImmediatePropagation();
        openLumoraAgent();
        return;
      }

      // The mirrored showcase still contains its original project routes.
      // In Lumora those routes resolve to the host SPA and fall through to its
      // login view. Keep the canvas hover and scroll interactions, but make a
      // plain click on the 3D scene intentionally stay on the current page.
      if (target?.closest("#Stage, canvas")) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);
    addEventListener("hashchange", () => {
      if (location.hash === "#lumora-agent-use") openLumoraAgent();
    });
    let lastEndState = null;
    let lastCageCoreState = null;
    setInterval(() => {
      const progress = Number(window.__LUMORA_SOURCE_SCROLL__?.progress || 0);
      const cageCore = document.querySelector(".cage-core");
      const cageCoreActive = progress >= 0.707 && progress <= 0.782;
      if (cageCore) {
        const cageCoreY = Math.max(29, Math.min(65, 55 - ((progress - 0.725) * 510)));
        cageCore.style.setProperty("--cage-core-y", `${cageCoreY}%`);
        if (cageCoreActive !== lastCageCoreState) {
          cageCore.classList.toggle("is-visible", cageCoreActive);
          lastCageCoreState = cageCoreActive;
        }
      }
      const atEnd = progress >= 0.985;
      if (atEnd === lastEndState) return;
      lastEndState = atEnd;
      parent.postMessage({ type: "lumora:source-end", atEnd }, location.origin);
    }, 120);
    addEventListener("error", (event) => {
      if (String(event.message).includes("Cannot read properties of undefined (reading 'length')")) event.preventDefault();
    });
  </script>
  <script defer src="/active-theory/assets/js/app.lumora.local-z-v2.js?v=lumora-agent-v12"></script>
</head>
<body>
  <!-- The host App owns the single persistent background-music player. The
       mirrored showcase checks for this marker and skips its legacy playlist. -->
  <audio id="homepage-autoplay-audio" aria-hidden="true" hidden></audio>
  <div class="cage-core" aria-hidden="true">
    <span class="cage-core__beam"></span>
    <span class="cage-core__ring cage-core__ring--outer"></span>
    <span class="cage-core__ring cage-core__ring--inner"></span>
    <span class="cage-core__nucleus"></span>
    <i class="cage-core__spark cage-core__spark--1"></i>
    <i class="cage-core__spark cage-core__spark--2"></i>
    <i class="cage-core__spark cage-core__spark--3"></i>
  </div>
  <noscript>This interactive experience requires JavaScript.</noscript>
</body>
</html>
